[package]
name = "bg-remove-rs"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone spike crate: not part of the app workspace.
[workspace]

[dependencies]
# load-dynamic: onnxruntime.dll is loaded at run time, so no MSVC-only link step.
# api-24: the newest DirectML build of ONNX Runtime on NuGet is 1.24.4.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "ndarray", "api-24"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
anyhow = "1"
